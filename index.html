<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>TRMNL Plugins by Hossain Khan</title>
  <meta name="description" content="Open-source plugins for the TRMNL e-ink display platform. Browse, install, or fork handcrafted recipes.">
  <meta name="author" content="Hossain Khan">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">

  <link rel="canonical" href="https://trmnl.hossainkhan.com">

  <!-- Open Graph -->
  <meta property="og:title" content="TRMNL Plugins by Hossain Khan">
  <meta property="og:description" content="Open-source plugins for the TRMNL e-ink display platform. Browse, install, or fork handcrafted recipes.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://trmnl.hossainkhan.com">
  <meta property="og:image" content="https://trmnl.hossainkhan.com/og-image.png">
  <meta property="og:site_name" content="TRMNL Plugins by Hossain Khan">
  <meta property="og:locale" content="en_US">

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="TRMNL Plugins by Hossain Khan">
  <meta name="twitter:description" content="Open-source plugins for the TRMNL e-ink display platform. Browse, install, or fork handcrafted recipes.">
  <meta name="twitter:image" content="https://trmnl.hossainkhan.com/og-image.png">

  <!-- Structured Data -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebSite",
    "name": "TRMNL Plugins by Hossain Khan",
    "url": "https://trmnl.hossainkhan.com",
    "description": "Open-source plugins for the TRMNL e-ink display platform. Browse, install, or fork handcrafted recipes.",
    "author": {
      "@type": "Person",
      "name": "Hossain Khan",
      "url": "https://github.com/hossain-khan"
    }
  }
  </script>

  <!-- Fonts: Instrument Sans (body) + DM Serif Display (headings) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Theme toggle -->
  <button class="theme-toggle" id="themeToggle" type="button" aria-label="Switch to dark mode">
    <svg class="theme-toggle__sun" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
    <svg class="theme-toggle__moon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
  </button>

  <!-- Header -->
  <header class="hero">
    <div class="hero__inner">
      <p class="hero__eyebrow">trmnl.hossainkhan.com</p>
      <h1 class="hero__title">Plugins for <span class="hero__accent">TRMNL</span></h1>
      <p class="hero__subtitle">Open-source recipes for the e-ink display platform &mdash; built to be installed, forked, and remixed.</p>
      <div class="hero__stats" id="heroStats" aria-label="Portfolio statistics">
        <!-- Populated by JS -->
      </div>
    </div>
  </header>

  <!-- Filter bar -->
  <nav class="filters" aria-label="Filter plugins by category">
    <div class="filters__inner" id="filterBar">
      <!-- Populated by JS -->
    </div>
  </nav>

  <!-- Plugin grid -->
  <main class="grid-wrap">
    <div class="plugin-grid" id="pluginGrid">
      <!-- Populated by JS -->
    </div>
    <p class="grid-empty" id="gridEmpty" hidden>No plugins in this category. Choose another or view <button type="button" class="grid-empty__reset" id="gridEmptyReset">all plugins</button>.</p>
  </main>

  <!-- Footer -->
  <footer class="site-footer">
    <div class="site-footer__inner">
      <p class="site-footer__built">
        Built for <a href="https://trmnl.com" target="_blank" rel="noopener noreferrer">TRMNL</a>
      </p>
      <p class="site-footer__author">
        <a href="https://github.com/hossain-khan" target="_blank" rel="noopener noreferrer">GitHub</a>
      </p>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
