name: Sync Recipes Data

on:
  schedule:
    - cron: '0 6 * * 1'  # Every Monday at 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Fetch and update recipes.json
        run: |
          python3 - <<'EOF'
          import json
          import sys
          import urllib.request
          import urllib.error

          url = "https://trmnl-badges.gohk.xyz/api/recipes?user_id=29"
          headers = {
              "User-Agent": "Mozilla/5.0 (compatible; GitHubActions recipe sync)",
              "Accept": "application/json,text/plain,*/*",
              "Referer": "https://trmnl.hossainkhan.com/",
          }
          request = urllib.request.Request(url, headers=headers)

          try:
              with urllib.request.urlopen(request, timeout=30) as response:
                  raw_body = response.read().decode("utf-8")
                  new_data = json.loads(raw_body)
          except urllib.error.HTTPError as error:
              body = error.read().decode("utf-8", errors="replace")
              print(f"HTTP {error.code} while fetching {url}", file=sys.stderr)
              print(body[:1000], file=sys.stderr)
              raise
          except urllib.error.URLError as error:
              print(f"Network error while fetching {url}: {error}", file=sys.stderr)
              raise

          with open("data/recipes.json") as f:
              existing = json.load(f)

          # Strip custom_fields from each plugin entry
          for plugin in new_data["data"]:
              plugin.pop("custom_fields", None)

          # Preserve metadata keys, update data and pagination fields
          for key in new_data:
              if key != "data":
                  existing[key] = new_data[key]
          existing["data"] = new_data["data"]

          with open("data/recipes.json", "w") as f:
              json.dump(existing, f, indent=4)
              f.write("\n")

          print(f"Updated: {len(new_data['data'])} plugins written")
          EOF

      - name: Commit updated recipes.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/recipes.json
          git diff --cached --quiet || git commit -m "chore: sync recipes data from TRMNL API"
          git push
